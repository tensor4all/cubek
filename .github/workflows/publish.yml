name: publish

# Generated for the ported 0.3.0 release: one job per workspace crate, in
# dependency order, each gated on the crates it needs.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run-only:
        description: "Run crate publish jobs in dry-run mode (no publish)"
        type: boolean
        required: false
        default: false

jobs:
  publish-t4a-cubek-tile:
    needs:
      - publish-t4a-cubek-quant
      - publish-t4a-cubek-test-utils
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek-tile
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubek-test-utils:
    needs:
      - publish-t4a-cubek-tile
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek-test-utils
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubek-quant:
    needs:
      - publish-t4a-cubek-test-utils
      - publish-t4a-cubek-tile
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek-quant
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubek-std:
    needs:
      - publish-t4a-cubek-test-utils
      - publish-t4a-cubek-tile
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek-std
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubek-matmul:
    needs:
      - publish-t4a-cubek-matmul
      - publish-t4a-cubek-quant
      - publish-t4a-cubek-std
      - publish-t4a-cubek-test-utils
      - publish-t4a-cubek-tile
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek-matmul
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubek-attention:
    needs:
      - publish-t4a-cubek-attention
      - publish-t4a-cubek-matmul
      - publish-t4a-cubek-std
      - publish-t4a-cubek-test-utils
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek-attention
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubek-convolution:
    needs:
      - publish-t4a-cubek-convolution
      - publish-t4a-cubek-matmul
      - publish-t4a-cubek-std
      - publish-t4a-cubek-test-utils
      - publish-t4a-cubek-tile
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek-convolution
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubek-fft:
    needs:
      - publish-t4a-cubek-fft
      - publish-t4a-cubek-test-utils
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek-fft
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubek-interpolate:
    needs:
      - publish-t4a-cubek-interpolate
      - publish-t4a-cubek-test-utils
      - publish-t4a-cubek-tile
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek-interpolate
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubek-pool:
    needs:
      - publish-t4a-cubek-pool
      - publish-t4a-cubek-test-utils
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek-pool
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubek-random:
    needs:
      - publish-t4a-cubek-std
      - publish-t4a-cubek-test-utils
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek-random
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubek-reduce:
    needs:
      - publish-t4a-cubek-reduce
      - publish-t4a-cubek-std
      - publish-t4a-cubek-test-utils
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek-reduce
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-t4a-cubek:
    needs:
      - publish-t4a-cubek-attention
      - publish-t4a-cubek-convolution
      - publish-t4a-cubek-fft
      - publish-t4a-cubek-interpolate
      - publish-t4a-cubek-matmul
      - publish-t4a-cubek-pool
      - publish-t4a-cubek-quant
      - publish-t4a-cubek-random
      - publish-t4a-cubek-reduce
      - publish-t4a-cubek-std
      - publish-t4a-cubek-tile
    uses: tracel-ai/github-actions/.github/workflows/publish-crate.yml@v8
    with:
      crate: t4a-cubek
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
