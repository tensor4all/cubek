[package]
authors = ["Sublime12", "louisfd"]
categories = ["science", "mathematics", "algorithms"]
description = "CubeK: Fast Fourier Transform"
edition.workspace = true
keywords = []
license.workspace = true
name = "cubek-fft"
publish = false
readme.workspace = true
repository = "https://github.com/tensor4all/cubek/tree/main/crates/cubek-fft"
# `cubek-fft` is not published from this fork (`publish = false`, and the
# crates.io name belongs to upstream), so its version stays on the 0.2.0 line
# that tenferro-rs requires for both the git revision and the registry.
version = "0.2.0"

[features]
default = ["std", "cubecl/default"]
std = ["cubecl/std"]

heavy = []
extended = ["heavy"]
full = ["extended"]

cpu-reference = ["dep:num-complex", "dep:cubek-test-utils"]

[dependencies]
cubecl = { workspace = true }
thiserror = { workspace = true }
cubek-test-utils = { package = "t4a-cubek-test-utils", path = "./../cubek-test-utils/", version = "=0.2.1", default-features = false, optional = true }
num-complex = { version = "0.4.6", optional = true }

[dev-dependencies]
num-complex = "0.4.6"
cubecl = { workspace = true, features = ["test-runtime"] }
cubecl-common = { workspace = true }
cubek-fft = { path = ".", features = ["cpu-reference"] }
cubek-test-utils = { package = "t4a-cubek-test-utils", path = "./../cubek-test-utils/", version = "=0.2.1", default-features = false }
