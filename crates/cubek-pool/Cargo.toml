[package]
authors = ["samuelbelanger <samuel.belanger.11@ulaval.ca>"]
categories = ["science", "mathematics", "algorithms"]
description = "CubeK: Pool"
edition.workspace = true
keywords = []
license.workspace = true
name = "t4a-cubek-pool"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubek/tree/main/crates/cubek-pool"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "cubecl/default"]
std = ["cubecl/std", "thiserror/std"]

extended = ["heavy"]
full = ["extended"]
heavy = []

benchmarks = ["cpu-reference", "cubecl/test-runtime"]
cpu-reference = ["dep:cubek-test-utils"]

[dependencies]
cubek-test-utils = { package = "t4a-cubek-test-utils", workspace = true, optional = true }

cubecl = { workspace = true }
cubecl-common = { workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
cubek-pool = { package = "t4a-cubek-pool", path = ".", features = ["cpu-reference", "benchmarks"] }
cubek-test-utils = { package = "t4a-cubek-test-utils", workspace = true }

cubecl = { workspace = true, features = ["test-runtime"] }
